<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jonsercrate Demon List</title><style>
:root{color-scheme:dark;--bg:#080c15;--panel:#10192b;--line:#263653;--text:#eaf1ff;--muted:#9aacca;--purple:#8b45ff;--cyan:#36d9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Arial}header{padding:16px;background:#0d1424;border-bottom:1px solid var(--line);position:sticky;top:0}main{max-width:1100px;margin:auto;padding:16px}h1{margin:4px 0;color:#b38aff}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,input,select,textarea{font:inherit;color:inherit;background:#10192b;border:1px solid var(--line);border-radius:8px;padding:10px}button{cursor:pointer}button.active,button.primary{background:#6425d9}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:grid;gap:5px;margin:8px 0}input,textarea,select{width:100%}.hidden{display:none!important}.status{padding:10px;border-radius:8px;background:#1b2940;margin:10px 0}a{color:var(--cyan)}</style></head><body><header><h1>◆ JONSERCRATE DEMON LIST</h1><div class="muted">Community-ranked Geometry Dash levels</div><nav><button data-tab="main" class="active">Main List</button><button data-tab="challenges">Challenge List</button><button data-tab="impossible">Impossible Levels</button><button id="statsTab">Player Stats</button><button id="modBtn">Moderator Login</button></nav></header><main><div id="status" class="status">Loading list…</div><section class="panel"><input id="search" placeholder="Search levels or players…"></section><section id="listPanel" class="panel"><h2 id="listTitle">Main List</h2><div class="scroll"><table><thead><tr><th>Rank</th><th>Level</th><th>Creator</th><th>Verifier</th><th>Points</th><th>Video</th></tr></thead><tbody id="levels"></tbody></table></div></section><section id="statsPanel" class="panel hidden"><h2>Player leaderboard</h2><div class="scroll"><table><thead><tr><th>Player</th><th>Completions</th><th>Total points</th></tr></thead><tbody id="players"></tbody></table></div></section><section id="modPanel" class="panel hidden"><h2>Moderator</h2><div id="loginBox"><label>Moderator password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">Log in</button></div><div id="editor" class="hidden"><h3>Add or edit level</h3><div class="grid"><label>Category<select id="category"><option value="main">Main List</option><option value="challenges">Challenge List</option><option value="impossible">Impossible Levels</option></select></label><label>Level name<input id="name"></label><label>Rank<input id="rank" type="number" min="1" value="1"></label><label>Creator<input id="creator"></label><label>Verifier<input id="verifier"></label><label>Video URL (YouTube or shareable Google Drive)<input id="video"></label><label>Description<textarea id="description"></textarea></label></div><div class="actions"><button class="primary" id="saveLevel">Save level</button><button id="clearForm">Clear form</button></div><h3>Existing levels</h3><div id="manageLevels"></div><hr><h3>Record a completion</h3><div class="grid"><label>Player name<input id="playerName"></label><label>Level<select id="recordLevel"></select></label><label>Proof/video URL<input id="proof"></label></div><button class="primary" id="addRecord">Save completion</button><h3>Completions</h3><div id="manageRecords"></div><button id="logout">Log out</button></div></section></main><script>
// Paste your deployed Cloudflare Worker URL between the quotes below.
const API_URL='https://jonsercrate-list-admin.liamjones0204.workers.dev/';let data={levels:[],completions:[]},password='',editingId=null,tab='main';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pts=l=>l.category==='impossible'?0:Math.max(1,Math.round(100*Math.pow(.965,Math.max(0,Number(l.rank)-1))));function msg(t){$('status').textContent=t}async function api(method,body){if(!API_URL||API_URL.includes('REPLACE_WITH'))throw Error('The Cloudflare Worker URL has not been added to index.html yet.');const r=await fetch(API_URL,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+password},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('Request failed ('+r.status+')'));return j}async function load(){try{const r=await fetch('data.json?ts='+Date.now());if(r.ok)data=await r.json();if(!Array.isArray(data.levels))data.levels=[];if(!Array.isArray(data.completions))data.completions=[];msg('List loaded.');render()}catch(e){msg('Could not load data.json: '+e.message)}}function render(){const q=$('search').value.toLowerCase();const arr=data.levels.filter(l=>(l.category||'main')===tab&&[l.name,l.creator,l.verifier].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.rank-b.rank);$('listTitle').textContent={main:'Main List',challenges:'Challenge List',impossible:'Impossible Levels'}[tab];$('levels').innerHTML=arr.map(l=>`<tr><td>${esc(l.rank)}</td><td><b>${esc(l.name)}</b><br><small>${esc(l.description)}</small></td><td>${esc(l.creator)}</td><td>${esc(l.verifier)}</td><td>${pts(l)}</td><td>${l.video?`<a href="${esc(l.video)}" target="_blank" rel="noopener">Watch proof ↗</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No levels here yet.</td></tr>';const scores={};data.completions.forEach(c=>{const l=data.levels.find(x=>x.id===c.levelId);if(!l)return;const p=c.player;scores[p]??={player:p,count:0,points:0};scores[p].count++;scores[p].points+=pts(l)});$('players').innerHTML=Object.values(scores).sort((a,b)=>b.points-a.points).map(p=>`<tr><td>${esc(p.player)}</td><td>${p.count}</td><td>${p.points}</td></tr>`).join('')||'<tr><td colspan="3">No completions yet.</td></tr>';renderManager()}function renderManager(){if($('editor').classList.contains('hidden'))return;$('manageLevels').innerHTML=data.levels.map(l=>`<div class="actions"><span>${esc(l.category)} · #${l.rank} ${esc(l.name)}</span><button data-edit="${esc(l.id)}">Edit</button><button data-delete="${esc(l.id)}">Delete</button></div>`).join('')||'No levels yet.';$('recordLevel').innerHTML=data.levels.map(l=>`<option value="${esc(l.id)}">${esc(l.name)} (${esc(l.category)})</option>`).join('');$('manageRecords').innerHTML=data.completions.map((c,i)=>`<div class="actions"><span>${esc(c.player)} — ${esc(data.levels.find(l=>l.id===c.levelId)?.name||'Deleted level')}</span><button data-delrec="${i}">Remove</button></div>`).join('')||'No completions yet.'}async function save(){msg('Saving to GitHub…');try{await api('POST',data);msg('Saved successfully to GitHub.');await load()}catch(e){msg('Save failed: '+e.message)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('statsPanel').classList.add('hidden');$('listPanel').classList.remove('hidden');render()});$('statsTab').onclick=()=>{$('listPanel').classList.add('hidden');$('statsPanel').classList.remove('hidden')};$('modBtn').onclick=()=>$('modPanel').classList.toggle('hidden');$('search').oninput=render;$('login').onclick=async()=>{password=$('password').value;if(!password){msg('Enter your moderator password.');return}$('loginBox').classList.add('hidden');$('editor').classList.remove('hidden');renderManager();msg('Moderator panel opened. Try saving a test change to verify the password.');};$('logout').onclick=()=>{password='';$('password').value='';$('editor').classList.add('hidden');$('loginBox').classList.remove('hidden');msg('Logged out.')};$('clearForm').onclick=()=>{editingId=null;['name','creator','verifier','video','description'].forEach(id=>$(id).value='');$('rank').value='1'};$('saveLevel').onclick=async()=>{const l={id:editingId||crypto.randomUUID(),category:$('category').value,name:$('name').value.trim(),rank:Number($('rank').value),creator:$('creator').value.trim(),verifier:$('verifier').value.trim(),video:$('video').value.trim(),description:$('description').value.trim()};if(!l.name||!l.rank||l.rank<1){msg('Enter a level name and valid rank.');return}const i=data.levels.findIndex(x=>x.id===l.id);if(i<0)data.levels.push(l);else data.levels[i]=l;await save()};$('addRecord').onclick=async()=>{const player=$('playerName').value.trim(),levelId=$('recordLevel').value;if(!player||!levelId){msg('Enter a player and choose a level.');return}if(data.completions.some(c=>c.player.toLowerCase()===player.toLowerCase()&&c.levelId===levelId)){msg('That player already has a record for this level.');return}data.completions.push({player,levelId,proof:$('proof').value.trim(),date:new Date().toISOString()});await save()};document.addEventListener('click',async e=>{const id=e.target.dataset.edit;if(id){const l=data.levels.find(x=>x.id===id);if(!l)return;editingId=id;['category','name','rank','creator','verifier','video','description'].forEach(k=>$(k).value=l[k]??(k==='category'?'main':''));window.scrollTo(0,$('modPanel').offsetTop)}const del=e.target.dataset.delete;if(del&&confirm('Delete this level and its completion records?')){data.levels=data.levels.filter(l=>l.id!==del);data.completions=data.completions.filter(c=>c.levelId!==del);await save()}const dr=e.target.dataset.delrec;if(dr!==undefined&&confirm('Remove this completion?')){data.completions.splice(Number(dr),1);await save()}});load();
</script></body></html>
